# Postgres for Curator, run by the CloudNativePG operator already in this
# cluster. The operator creates Service db-rw and Secret db-app (key uri),
# which the backend reads as DATABASE_URL.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: db
spec:
  instances: 1
  storage:
    size: 1Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
