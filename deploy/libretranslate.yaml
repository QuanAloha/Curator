# LibreTranslate, loading only the languages Curator supports (en, es, tl)
# to keep memory and start-up time down. Models download on first start and
# are kept on a PVC: on an emptyDir they count toward the cluster's default
# 1Gi ephemeral-storage limit per container, and the pod was evicted for it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: libretranslate-models
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 3Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: libretranslate
  labels:
    app: libretranslate
spec:
  replicas: 1
  # The models volume attaches to one node at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: libretranslate
  template:
    metadata:
      labels:
        app: libretranslate
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The image runs as uid 1032; let it write to the models volume.
        fsGroup: 1032
      containers:
        - name: libretranslate
          image: libretranslate/libretranslate:latest
          env:
            - name: LT_LOAD_ONLY
              value: en,es,tl
          ports:
            - name: http
              containerPort: 5000
          volumeMounts:
            - name: models
              mountPath: /home/libretranslate/.local
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 600m
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /languages
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 60
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: libretranslate-models
---
apiVersion: v1
kind: Service
metadata:
  name: libretranslate
  labels:
    app: libretranslate
spec:
  selector:
    app: libretranslate
  ports:
    - name: http
      port: 5000
      targetPort: http
