# Argo CD deploys this folder to your team's namespace. The GitHub Action
# sets the images below on every push to main; don't edit newName or newTag
# by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: team-go-utah
resources:
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - postgres.yaml
  - backend.yaml
  - whisperlive.yaml
  - libretranslate.yaml
  - otel-collector.yaml
images:
  - name: app
    newName: ghcr.io/quanaloha/curator
    newTag: a830d72
  - name: backend
    newName: ghcr.io/quanaloha/curator
    newTag: a830d72-backend
